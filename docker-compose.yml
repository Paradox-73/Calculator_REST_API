name: calculator-devops

services:

  # The Spring Boot API. Compose starts two replicas of it.
  calculator:
    image: ${IMAGE_NAME:-paradox73/calculator-app}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      APP_NAME: calculator-api
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
    networks:
      - calc-net

  # The reverse proxy. It is the only entry point from the host.
  nginx:
    image: calculator-nginx:latest
    build:
      context: ./nginx
    ports:
      # Port 8080 on the host normally belongs to Jenkins.
      # The stack therefore uses port 8081.
      - "${HOST_PORT:-8081}:80"
    depends_on:
      calculator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
