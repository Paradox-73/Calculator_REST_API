name: calculator-devops

# Settings shared by both API replicas.
x-calculator: &calculator
    image: ${IMAGE_NAME:-paradox73/calculator-app}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8080
      APP_NAME: calculator-api
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - calc-net

services:

  # Two replicas of the Spring Boot API. They are two services rather than
  # "replicas: 2" so the pipeline can replace them one at a time, and the
  # proxy always has one healthy replica (a rolling update).
  calculator-a: *calculator
  calculator-b: *calculator

  # The reverse proxy. It is the only entry point from the host.
  nginx:
    image: calculator-nginx:latest
    build:
      context: ./nginx
    ports:
      # Port 8080 on the host normally belongs to Jenkins.
      # The stack therefore uses port 8081.
      - "${HOST_PORT:-8081}:80"
    depends_on:
      calculator-a:
        condition: service_healthy
      calculator-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
