# Jenkins for this project:  docker compose -f jenkins/docker-compose.yml up -d --build
name: jenkins

services:

  jenkins:
    build: .
    image: calculator-jenkins:latest
    ports:
      - "8080:8080"
    env_file: .env
    # The pipeline runs "docker" through the host's Docker socket. Root is the
    # simplest way to get permission on that socket in Docker Desktop.
    user: root
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Gives Jenkins a temporary public HTTPS address, so the GitHub webhook can
  # reach it. Run ./update-webhook.sh after every start: the address changes.
  tunnel:
    image: cloudflare/cloudflared:2025.10.0
    command: tunnel --no-autoupdate --url http://jenkins:8080
    depends_on:
      - jenkins
    restart: unless-stopped

volumes:
  jenkins_home:
