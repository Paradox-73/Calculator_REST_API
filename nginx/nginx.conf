events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Docker gives every service an internal DNS name. This resolver reads
    # that DNS again every second, so a replaced replica gets traffic at once.
    resolver 127.0.0.11 valid=1s ipv6=off;

    # One upstream group with every calculator replica. "resolve" (Nginx
    # 1.27.3+) re-reads the replica addresses from Docker DNS at run time,
    # and the group gives real load balancing and failover between them.
    upstream calculator_api {
        zone calculator_api 64k;
        server calculator-a:8080 resolve;
        server calculator-b:8080 resolve;
    }

    server {
        listen 80;
        server_name _;

        # Health probe of the proxy itself.
        location = /nginx-health {
            add_header Content-Type application/json;
            return 200 '{"status":"UP","component":"nginx"}';
        }

        location / {
            proxy_pass http://calculator_api;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Send the request to another replica if one replica fails.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
