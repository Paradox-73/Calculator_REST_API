events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Docker gives every service an internal DNS name. This resolver reads
    # that DNS again every 10 seconds, so new API replicas receive traffic.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Health probe of the proxy itself.
        location = /nginx-health {
            add_header Content-Type application/json;
            return 200 '{"status":"UP","component":"nginx"}';
        }

        location / {
            # The variable forces a DNS lookup for each request group.
            # Nginx then balances the load over all calculator replicas.
            set $api_backend "http://calculator:8080";
            proxy_pass $api_backend$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Send the request to another replica if one replica fails.
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
